<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" role="img" aria-labelledby="t d">
<title id="t">四层评测 Judge 均分：multi 与 single</title>
<desc id="d">日常层无故障（01ac224 修复后回归）multi 0.812 single 0.833；复合层无故障（01ac224 修复后回归）multi 0.836 single 0.879；稳定性层一次性失败（01ac224 修复后回归）multi 0.878 single 0.890；稳定性层工具故障 multi 0.680 single 0.781；稳定性层角色一直失败 multi 0.649 single 0.416；稳定性层全部中断 multi 0.439 single 0.397</desc>
<style>
