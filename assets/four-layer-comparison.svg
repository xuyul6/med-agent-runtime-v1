<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" role="img" aria-labelledby="t d">
<title id="t">日常、复合与稳定性三层的 Judge 均分</title>
<desc id="d">日常层无故障 multi 0.8803 single 0.9001；复合层无故障 multi 0.8600 single 0.8675；稳定性层一次性失败 multi 0.8365 single 0.8785；稳定性层工具故障 multi 0.6740 single 0.7775；稳定性层角色一直失败 multi 0.6305 single 0.3141；稳定性层全部中断 multi 0.4313 single 0.2990</desc>
<style>
