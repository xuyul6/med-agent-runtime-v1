name: medagent-runtime
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env.local}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  chroma:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["chroma-data:/chroma/chroma"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: backend
    env_file: backend/.env.local
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      chroma: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 60s
  web:
    build: frontend
    ports: ["127.0.0.1:5174:80"]
    depends_on:
      api: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  redis-data:
  chroma-data:
    name: medagent-runtime_chromadb-data
